<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Learnova</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6c63ff;
        --primary-dark: #5a52e0;
        --secondary: #ff6584;
        --dark: #2a2d3e;
        --light: #f8f9fa;
        --gray: #6c757d;
        --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        --shadow-soft: 0 15px 35px rgba(0, 0, 0, 0.1);
        --transition: all 0.3s ease;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }

      /* --- Login Card Container --- */
      .login-container {
        width: 100%;
        max-width: 900px;
        background: white;
        border-radius: 24px;
        box-shadow: var(--shadow-soft);
        overflow: hidden;
        min-height: 600px;
      }

      /* --- Left Side (Brand/Image) --- */
      .login-brand {
        background: var(--gradient);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
        position: relative;
        overflow: hidden;
      }

      .brand-pattern {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.1) 1px,
          transparent 1px
        );
        background-size: 20px 20px;
        opacity: 0.5;
      }

      .logo-icon-lg {
        font-size: 80px;
        margin-bottom: 20px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      .brand-title {
        font-family: "Bubblegum Sans", cursive;
        font-size: 48px;
        margin-bottom: 10px;
      }

      /* --- Right Side (Form) --- */
      .login-form-container {
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .form-title {
        font-weight: 700;
        color: var(--dark);
        margin-bottom: 10px;
      }

      /* --- Custom Tabs --- */
      .nav-pills {
        background-color: #f8f9fa;
        padding: 5px;
        border-radius: 12px;
        margin-bottom: 30px;
        border: 1px solid #eee;
      }

      .nav-pills .nav-link {
        color: var(--gray);
        font-weight: 500;
        border-radius: 10px;
        transition: var(--transition);
        width: 50%;
        text-align: center;
      }

      .nav-pills .nav-link.active {
        background-color: white;
        color: var(--primary);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        font-weight: 600;
      }

      /* --- Inputs --- */
      .form-control {
        padding: 12px 15px;
        border-radius: 10px;
        border: 1px solid #e0e0e0;
        background-color: #fcfcfc;
        transition: var(--transition);
      }

      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        background-color: white;
      }

      .form-label {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--dark);
        margin-bottom: 8px;
      }

      .input-group-text {
        background: white;
        border-color: #e0e0e0;
        border-right: none;
        border-radius: 10px 0 0 10px;
        color: var(--gray);
      }

      .input-group .form-control {
        border-left: none;
        border-radius: 0 10px 10px 0;
      }

      .btn-login {
        background: var(--primary);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        width: 100%;
        margin-top: 20px;
        transition: var(--transition);
        box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
      }

      .btn-login:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
      }

      .credentials-box {
        background-color: #fff3cd;
        border: 1px solid #ffeeba;
        border-radius: 10px;
        padding: 15px;
        font-size: 0.85rem;
        color: #856404;
        margin-top: 20px;
      }

      @media (max-width: 768px) {
        .login-brand {
          padding: 30px;
          min-height: 200px;
        }
        .login-form-container {
          padding: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container px-4">
      <div class="row login-container g-0">
        <div class="col-lg-6 login-brand">
          <div class="brand-pattern"></div>
          <div class="position-relative z-1">
            <div class="logo-icon-lg">
              <i class="fas fa-graduation-cap"></i>
            </div>
            <h1 class="brand-title">Learnova</h1>
            <p class="lead opacity-75">
              Platform E-Learning Gamifikasi Masa Depan.
            </p>
            <div class="mt-4 d-none d-lg-block">
              <small class="d-block mb-2"
                ><i class="fas fa-check-circle me-2"></i> Belajar
                Interaktif</small
              >
              <small class="d-block mb-2"
                ><i class="fas fa-check-circle me-2"></i> Sistem Poin &
                Badge</small
              >
              <small class="d-block"
                ><i class="fas fa-check-circle me-2"></i> Pantau Progress
                Real-time</small
              >
            </div>
          </div>
        </div>

        <div class="col-lg-6 login-form-container">
          <div class="mb-4 text-center text-lg-start">
            <h3 class="form-title">Selamat Datang! 👋</h3>
            <p class="text-muted small">
              Silakan masuk ke akun Anda untuk melanjutkan.
            </p>
          </div>

          <ul class="nav nav-pills nav-justified" id="loginTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="student-tab"
                data-bs-toggle="pill"
                data-bs-target="#student-login"
                type="button"
                role="tab"
                onclick="setRole('student')"
              >
                <i class="fas fa-user-graduate me-2"></i> Siswa
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="admin-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-login"
                type="button"
                role="tab"
                onclick="setRole('admin')"
              >
                <i class="fas fa-user-shield me-2"></i> Admin
              </button>
            </li>
          </ul>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label for="email" class="form-label">Alamat Email</label>
              <div class="input-group">
                <span class="input-group-text"
                  ><i class="far fa-envelope"></i
                ></span>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="nama@email.com"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Kata Sandi</label>
              <div class="input-group">
                <span class="input-group-text"
                  ><i class="fas fa-lock"></i
                ></span>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="••••••••"
                  required
                />
                <button
                  class="btn btn-outline-secondary bg-white border-start-0"
                  type="button"
                  style="border-color: #e0e0e0; border-radius: 0 10px 10px 0"
                >
                  <i class="far fa-eye text-muted"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" />
                <label class="form-check-label small text-muted" for="remember">
                  Ingat Saya
                </label>
              </div>
              <a
                href="#"
                class="small text-decoration-none text-primary fw-medium"
                >Lupa Sandi?</a
              >
            </div>

            <button type="submit" class="btn btn-login">
              Masuk Sekarang <i class="fas fa-arrow-right ms-2"></i>
            </button>
          </form>

          <div class="credentials-box" id="credBox">
            <strong
              ><i class="fas fa-info-circle me-1"></i> Akun Demo
              (Siswa):</strong
            ><br />
            Email: <code>user@learnova.com</code><br />
            Pass: <code>user123</code>
          </div>

          <div class="text-center mt-4">
            <p class="small text-muted">
              Belum punya akun?
              <a href="#" class="text-primary fw-bold text-decoration-none"
                >Daftar Gratis</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // State untuk menyimpan role saat ini (default: student)
      let currentRole = "student";

      // Fungsi untuk mengubah tampilan info kredensial berdasarkan Tab
      function setRole(role) {
        currentRole = role;
        const credBox = document.getElementById("credBox");

        if (role === "student") {
          credBox.innerHTML = `
            <strong><i class="fas fa-info-circle me-1"></i> Akun Demo (Siswa):</strong><br>
            Email: <code>user@learnova.com</code><br>
            Pass: <code>user123</code>
          `;
          // Auto-fill for easier testing
          document.getElementById("email").value = "user@learnova.com";
          document.getElementById("password").value = "user123";
        } else {
          credBox.innerHTML = `
            <strong><i class="fas fa-key me-1"></i> Akun Demo (Admin):</strong><br>
            Email: <code>admin@learnova.com</code><br>
            Pass: <code>admin123</code>
          `;
          // Auto-fill for easier testing
          document.getElementById("email").value = "admin@learnova.com";
          document.getElementById("password").value = "admin123";
        }
      }

      // Fungsi Login Sederhana
      function handleLogin(e) {
        e.preventDefault(); // Mencegah reload halaman

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const btn = document.querySelector(".btn-login");

        // Efek loading
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
        btn.disabled = true;

        setTimeout(() => {
          // Logika Validasi Sederhana
          if (
            currentRole === "student" &&
            email === "user@learnova.com" &&
            password === "user123"
          ) {
            // Redirect ke halaman User
            // Pastikan file user.html ada di folder yang sama
            window.location.href = "user.html";
          } else if (
            currentRole === "admin" &&
            email === "admin@learnova.com" &&
            password === "admin123"
          ) {
            // Redirect ke halaman Admin
            // Pastikan file admin.html ada di folder yang sama
            window.location.href = "admin.html";
          } else {
            // Gagal Login
            alert(
              "Email atau kata sandi salah! Silakan cek kotak info di bawah tombol."
            );
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        }, 1000); // Simulasi delay jaringan 1 detik
      }

      // Initialize Default
      setRole("student");
    </script>
  </body>
</html>
